version: "2"
sql:
  - engine: "sqlite"
    queries: "query.sql"
    schema: "../migrations/"
    gen:
      go:
        package: "dbqueries"
        out: "../gen"
        overrides:
          - column: "users.user_id"
            go_type: "github.com/google/uuid.UUID"
          - column: "devices.user_id"
            go_type: "github.com/google/uuid.UUID"
          - column: "devices.device_id"
            go_type: "github.com/google/uuid.UUID"